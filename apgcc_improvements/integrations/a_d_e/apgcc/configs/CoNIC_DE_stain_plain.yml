# D+E clean组合 (去掉 A 的激进训练配方): DCNv2+Edge+stain, 回到原始 APGCC 训练超参.
#   D : DCNv2(2) + Edge Ignore(16/0.1)
#   E : pathology / stain augmentation (train-only)
#   A : 训练配方关闭 (EOS_COEF=0.5 原始, FOCAL_GAMMA=0 关, SET_COST_POINT=0.05 原始);
#       A 只以后处理形式参与 (训练后再跑 density_threshold / scan_threshold 阈值校准).
# 目的: 让 D+E 的结构增益干净体现, 对标 baseline ~12 / D Edge-only 11.01 / E stain 11.48.
TAG: 'APGCC_CoNIC_DE_stain_plain'
SEED: 1229
GPU_ID: 3
OUTPUT_DIR: './output/CoNIC_DE_stain_plain/'
VIS: False

MODEL:
  ENCODER: 'vgg16_bn'
  ENCODER_kwargs: {"last_pool": False}
  DECODER: 'IFI'
  DECODER_kwargs: {"num_classes": 2,
                   "inner_planes": 64,
                   "feat_layers":[3,4],
                   "pos_dim": 32,
                   "ultra_pe": True,
                   "learn_pe": False,
                   "unfold": False,
                   "local": True,
                   "no_aspp": False,
                   "require_grad": True,
                   "out_type": 'Normal',
                   "head_layers":[1024,512,256,256]}

  FROZEN_WEIGHTS: None

  STRIDE: 8
  ROW: 2
  LINE: 2
  POINT_LOSS_COEF: 0.0002
  EOS_COEF: 0.5           # 原始 (关闭 A 的 EOS 下调)
  FOCAL_GAMMA: 0.0        # 关闭 A 的 focal

  LOSS: ['L2']
  WEIGHT_DICT: {'loss_ce': 1, 'loss_points': 0.0002, 'loss_aux': 0.}
  AUX_EN: False
  AUX_NUMBER: [2, 2]
  AUX_RANGE: [2, 8]
  AUX_kwargs: {'pos_coef': 1., 'neg_coef': 1., 'pos_loc': 0.0002, 'neg_loc': 0.0002}

  DCNV2_ENABLED: True     # D
  DCNV2_LAYERS: 2         # D
  EDGE_BAND: 16           # D
  EDGE_WEIGHT: 0.1        # D
RESUME: True
RESUME_PATH: './output/SHHA_best.pth'
FINETUNE: True

DATASETS:
  DATASET: 'SHHA'
  DATA_ROOT: '/data1/llx/CoNICdata'
  EVAL_LIST: 'val.list'

DATALOADER:
  AUGUMENTATION: ['Normalize', 'Crop', 'Flip']
  CROP_SIZE: 128
  CROP_NUMBER: 4
  UPPER_BOUNDER: -1
  NUM_WORKERS: 4
  AUG_PROTOCOL: 'native'
  PATHOLOGY_AUG: True               # E
  STAIN_JITTER: True                # E
  BLUR_NOISE: True                  # E
  DOMAIN_NAMES: ['crag', 'dpath', 'glas', 'pannuke', 'consep']

SOLVER:
  BATCH_SIZE: 8
  START_EPOCH: 0
  EPOCHS: 100
  LR: 0.00005
  LR_BACKBONE: 0.000005
  WEIGHT_DECAY: 0.0001
  LR_DROP: 800
  CLIP_MAX_NORM: 0.1
  EVAL_FREQ: 5
  LOG_FREQ: 5

MATCHER:
  SET_COST_CLASS: 1.
  SET_COST_POINT: 0.05     # 原始 tau (关闭 A 的 tau 上调)

TEST:
  THRESHOLD: 0.5
  WEIGHT: './output/CoNIC_DE_stain_plain/best.pth'
